{{ define "main" }}
<section class="page">
  <header>
    <h1 class="page__title">{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="page__lede">{{ . }}</p>{{ end }}
  </header>
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <p class="post-meta">{{ .Date.Format "January 2, 2006" }}</p>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Summary }}<p>{{ . | plainify | truncate 180 }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
