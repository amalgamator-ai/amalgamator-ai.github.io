# Netlify Deploy Previews for website PRs and amalgamator docs PRs.
# amalgamator is public — docs are shallow-fetched over HTTPS (no tokens).
#
# docs_ref set  → build that amalgamator SHA (product docs PR)
# docs_ref empty → build vars.AMALGAMATOR_DOCS_REF or main

name: Netlify Preview

on:
  pull_request:
  workflow_dispatch:
    inputs:
      caller_repo:
        description: "owner/repo to comment on (empty = this repo)"
        required: false
        type: string
        default: ""
      caller_pr:
        description: "PR number to comment on"
        required: false
        type: string
        default: ""
      docs_ref:
        description: "amalgamator git ref/SHA whose docs/ to build (empty = latest)"
        required: false
        type: string
        default: ""
      website_ref:
        description: "website git ref (default main for remote triggers)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      caller_repo:
        required: true
        type: string
      caller_pr:
        required: true
        type: string
      docs_ref:
        required: true
        type: string
      website_ref:
        required: false
        type: string
        default: "main"
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netlify-preview-${{ github.event.pull_request.number || inputs.caller_pr || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve preview context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_CALLER_REPO: ${{ inputs.caller_repo }}
          INPUT_CALLER_PR: ${{ inputs.caller_pr }}
          INPUT_DOCS_REF: ${{ inputs.docs_ref }}
          INPUT_WEBSITE_REF: ${{ inputs.website_ref }}
          THIS_REPO: ${{ github.repository }}
          DEFAULT_DOCS_REF: ${{ vars.AMALGAMATOR_DOCS_REF || 'main' }}
        run: |
          set -euo pipefail
          caller_repo=""
          caller_pr=""
          docs_ref=""
          website_ref=""
          alias_prefix="deploy-preview"
          remote_website="false"

          # workflow_call inputs are set when amalgamator invokes this reusable
          # workflow. Native website PRs leave them empty. Event name often stays
          # pull_request for cross-repo calls, so detect via inputs.
          called_with_inputs="false"
          if [ -n "${INPUT_CALLER_REPO:-}" ] && [ -n "${INPUT_CALLER_PR:-}" ]; then
            called_with_inputs="true"
          fi

          case "${EVENT_NAME}" in
            pull_request)
              if [ "${called_with_inputs}" = "true" ]; then
                caller_repo="${INPUT_CALLER_REPO}"
                caller_pr="${INPUT_CALLER_PR}"
                docs_ref="${INPUT_DOCS_REF}"
                website_ref="${INPUT_WEBSITE_REF:-main}"
                alias_prefix="docs-preview"
                remote_website="true"
              else
                caller_repo="${THIS_REPO}"
                caller_pr="${PR_NUMBER}"
                docs_ref="${DEFAULT_DOCS_REF}"
              fi
              ;;
            workflow_call)
              caller_repo="${INPUT_CALLER_REPO}"
              caller_pr="${INPUT_CALLER_PR}"
              docs_ref="${INPUT_DOCS_REF}"
              website_ref="${INPUT_WEBSITE_REF:-main}"
              alias_prefix="docs-preview"
              remote_website="true"
              ;;
            workflow_dispatch)
              caller_repo="${INPUT_CALLER_REPO:-$THIS_REPO}"
              caller_pr="${INPUT_CALLER_PR}"
              docs_ref="${INPUT_DOCS_REF:-$DEFAULT_DOCS_REF}"
              website_ref="${INPUT_WEBSITE_REF}"
              if [ "${INPUT_DOCS_REF:-}" != "" ] && [ "${INPUT_CALLER_REPO:-}" != "" ] && [ "${INPUT_CALLER_REPO}" != "${THIS_REPO}" ]; then
                alias_prefix="docs-preview"
              fi
              if [ "${THIS_REPO}" != "amalgamator-ai/amalgamator-ai.github.io" ] || [ -n "${website_ref}" ]; then
                remote_website="true"
                website_ref="${website_ref:-main}"
              fi
              ;;
          esac

          if [ -z "${caller_pr}" ]; then
            echo "::error::Missing PR number for preview alias and comment."
            exit 1
          fi
          if [ -z "${caller_repo}" ]; then
            caller_repo="${THIS_REPO}"
          fi
          if [ -z "${docs_ref}" ]; then
            docs_ref="${DEFAULT_DOCS_REF}"
          fi

          if [ "${THIS_REPO}" != "amalgamator-ai/amalgamator-ai.github.io" ]; then
            remote_website="true"
            website_ref="${website_ref:-main}"
            if [ "${alias_prefix}" = "deploy-preview" ] && [ "${called_with_inputs}" = "true" ]; then
              alias_prefix="docs-preview"
            fi
          fi

          {
            echo "caller_repo=${caller_repo}"
            echo "caller_pr=${caller_pr}"
            echo "docs_ref=${docs_ref}"
            echo "website_ref=${website_ref}"
            echo "alias=${alias_prefix}-${caller_pr}"
            echo "remote_website=${remote_website}"
          } >> "$GITHUB_OUTPUT"
          echo "caller=${caller_repo}#${caller_pr} docs_ref=${docs_ref} remote_website=${remote_website}"

      - name: Checkout website (this repo)
        if: steps.ctx.outputs.remote_website != 'true'
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout website (remote trigger)
        if: steps.ctx.outputs.remote_website == 'true'
        uses: actions/checkout@v7
        with:
          repository: amalgamator-ai/amalgamator-ai.github.io
          ref: ${{ steps.ctx.outputs.website_ref }}
          submodules: false

      - name: Fetch amalgamator docs
        run: |
          chmod +x scripts/fetch_amalgamator_docs.sh
          scripts/fetch_amalgamator_docs.sh "${{ steps.ctx.outputs.docs_ref }}" .cache/amalgamator-src

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Resolve preview URL
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
          ALIAS: ${{ steps.ctx.outputs.alias }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::Set secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID."
            exit 1
          fi
          site_name="${NETLIFY_SITE_NAME:-}"
          if [ -z "$site_name" ]; then
            site_name="$(npx --yes netlify-cli@23.11.0 api getSite --data "{\"site_id\":\"${NETLIFY_SITE_ID}\"}" | jq -r .name)"
          fi
          if [ -z "$site_name" ] || [ "$site_name" = "null" ]; then
            echo "::error::Could not resolve Netlify site name; set variable NETLIFY_SITE_NAME."
            exit 1
          fi
          base_url="https://${ALIAS}--${site_name}.netlify.app/"
          {
            echo "base_url=${base_url}"
            echo "site_name=${site_name}"
          } >> "$GITHUB_OUTPUT"
          echo "Preview base URL: ${base_url}"

      - name: Build site for preview
        env:
          HUGO_BASEURL: ${{ steps.preview.outputs.base_url }}
          DOCS_SOURCE: .cache/amalgamator-src/docs
          GIT_LFS_SKIP_SMUDGE: "1"
        run: make build

      - name: Deploy preview to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_ALIAS: ${{ steps.ctx.outputs.alias }}
          CALLER_PR: ${{ steps.ctx.outputs.caller_pr }}
        run: |
          set -euo pipefail
          output="$(npx --yes netlify-cli@23.11.0 deploy \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --site="${NETLIFY_SITE_ID}" \
            --dir=public \
            --alias="${NETLIFY_ALIAS}" \
            --no-build \
            --message="PR #${CALLER_PR} ${GITHUB_SHA}" \
            --json)"
          printf '%s\n' "${output}"
          deploy_url="$(printf '%s' "${output}" | jq -r '.deploy_url // .ssl_url // .url // empty')"
          if [ -z "${deploy_url}" ]; then
            echo "::error::Netlify CLI did not return a deploy URL."
            exit 1
          fi
          echo "deploy_url=${deploy_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${deploy_url}"

      - name: Comment preview URL on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deploy_url }}
          BASE_URL: ${{ steps.preview.outputs.base_url }}
          CALLER_REPO: ${{ steps.ctx.outputs.caller_repo }}
          CALLER_PR: ${{ steps.ctx.outputs.caller_pr }}
          DOCS_REF: ${{ steps.ctx.outputs.docs_ref }}
        run: |
          set -euo pipefail
          body="$(printf 'Netlify Deploy Preview: %s\n\nDocs ref: `%s`\nBuilt with `HUGO_BASEURL=%s`.' "${PREVIEW_URL}" "${DOCS_REF}" "${BASE_URL}")"
          existing="$(gh api \
            "repos/${CALLER_REPO}/issues/${CALLER_PR}/comments" \
            --jq '.[] | select(.user.type=="Bot" and (.body | startswith("Netlify Deploy Preview:"))) | .id' \
            | head -n1 || true)"
          if [ -n "${existing}" ]; then
            gh api \
              --method PATCH \
              "repos/${CALLER_REPO}/issues/comments/${existing}" \
              -f body="${body}"
          else
            gh api \
              --method POST \
              "repos/${CALLER_REPO}/issues/${CALLER_PR}/comments" \
              -f body="${body}"
          fi
