name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by amalgamator Docs Publish when docs / policy files land on main.
  repository_dispatch:
    types: [docs-publish]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve amalgamator docs ref
        id: docs
        env:
          DISPATCH_REF: ${{ github.event.client_payload.docs_ref }}
          DEFAULT_REF: ${{ vars.AMALGAMATOR_DOCS_REF || 'main' }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF:-}"
          if [ -z "${ref}" ]; then
            ref="${DEFAULT_REF}"
          fi
          echo "docs_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Fetching amalgamator docs at ${ref}"

      - name: Fetch amalgamator docs
        run: |
          chmod +x scripts/fetch_amalgamator_docs.sh
          scripts/fetch_amalgamator_docs.sh "${{ steps.docs.outputs.docs_ref }}" .cache/amalgamator-src

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          DOCS_SOURCE: .cache/amalgamator-src/docs
        run: make build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
