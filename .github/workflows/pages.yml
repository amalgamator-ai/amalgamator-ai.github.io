name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Website checkout must use github.token. AMALGAMATOR_REPO_TOKEN only
      # has access to private amalgamator and will 403 on this repo.
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Detect amalgamator access token
        id: tok
        env:
          AMALGAMATOR_REPO_TOKEN: ${{ secrets.AMALGAMATOR_REPO_TOKEN }}
        run: |
          if [ -n "${AMALGAMATOR_REPO_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AMALGAMATOR_REPO_TOKEN unset; build will use vendor/docs if needed."
          fi

      - name: Checkout private amalgamator
        if: steps.tok.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: amalgamator-ai/amalgamator
          path: sources/amalgamator
          token: ${{ secrets.AMALGAMATOR_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Sync amalgamator to recorded submodule commit
        if: steps.tok.outputs.present == 'true'
        run: |
          set -euo pipefail
          sha="$(git ls-tree HEAD sources/amalgamator | awk '{print $3}')"
          if [ -z "${sha}" ]; then
            echo "No submodule gitlink; leaving checkout at default ref"
            exit 0
          fi
          echo "Checking out amalgamator @ ${sha}"
          git -C sources/amalgamator fetch --depth 1 origin "${sha}"
          git -C sources/amalgamator checkout --force "${sha}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: make build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
