name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      docs_ref:
        description: "amalgamator git ref/SHA whose docs/ to publish (empty = latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve amalgamator docs ref
        id: docs
        env:
          INPUT_REF: ${{ inputs.docs_ref }}
          DEFAULT_REF: ${{ vars.AMALGAMATOR_DOCS_REF || 'main' }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          if [ -z "${ref}" ]; then
            ref="${DEFAULT_REF}"
          fi
          remote="false"
          if [ "${THIS_REPO}" != "amalgamator-ai/amalgamator-ai.github.io" ]; then
            remote="true"
          fi
          {
            echo "docs_ref=${ref}"
            echo "remote_website=${remote}"
          } >> "$GITHUB_OUTPUT"
          echo "docs_ref=${ref} remote_website=${remote}"

      # Native run on the website repo.
      - name: Checkout website
        if: steps.docs.outputs.remote_website != 'true'
        uses: actions/checkout@v4
        with:
          submodules: false

      # workflow_call from amalgamator keeps the caller's github.repository.
      - name: Checkout website (from amalgamator)
        if: steps.docs.outputs.remote_website == 'true'
        uses: actions/checkout@v4
        with:
          repository: amalgamator-ai/amalgamator-ai.github.io
          ref: main
          submodules: false

      - name: Fetch amalgamator docs
        run: |
          chmod +x scripts/fetch_amalgamator_docs.sh
          scripts/fetch_amalgamator_docs.sh "${{ steps.docs.outputs.docs_ref }}" .cache/amalgamator-src

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          DOCS_SOURCE: .cache/amalgamator-src/docs
        run: make build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
